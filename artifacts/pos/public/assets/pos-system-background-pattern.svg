<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="960"
     height="560"
     viewBox="0 0 960 560"
     fill="none">
  <title>Seamless POS system icon pattern</title>
  <desc>
    Transparent, seamless, low-contrast pattern for a dark Arabic POS interface.
    It combines the system navigation icons with sanitary-ware, paint and
    hardware shop symbols.
  </desc>

  <defs>
    <!-- System navigation icons -->
    <symbol id="dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </symbol>

    <symbol id="cart" viewBox="0 0 24 24">
      <path d="M3 4h2l2.2 10.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6"/>
      <circle cx="9" cy="20" r="1.2"/>
      <circle cx="18" cy="20" r="1.2"/>
    </symbol>

    <symbol id="quotation" viewBox="0 0 24 24">
      <path d="M6 2.8h8l4 4V21H6a2 2 0 0 1-2-2V4.8a2 2 0 0 1 2-2Z"/>
      <path d="M14 2.8V7h4M8 11h6M8 15h7M8 7.5h2"/>
    </symbol>

    <symbol id="invoice" viewBox="0 0 24 24">
      <path d="M6 2.8h12v18.4l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3V2.8Z"/>
      <path d="M14.6 8.2c-.5-.5-1.2-.7-2-.7-1.1 0-2 .6-2 1.5 0 2.3 4.3 1.1 4.3 3.6 0 1-.9 1.7-2.2 1.7-.9 0-1.8-.3-2.4-1M12.6 6.2v9.5"/>
    </symbol>

    <symbol id="return" viewBox="0 0 24 24">
      <path d="M4 8V3.8M4 8h4.2M4.4 7.5A9 9 0 1 1 3 14"/>
    </symbol>

    <symbol id="purchases" viewBox="0 0 24 24">
      <path d="M5 7h14l-1 14H6L5 7Z"/>
      <path d="M8 8V6a4 4 0 0 1 8 0v2M8.5 12c.8 1 2 1.5 3.5 1.5s2.7-.5 3.5-1.5"/>
    </symbol>

    <symbol id="product" viewBox="0 0 24 24">
      <path d="m12 2.8 8 4.6v9.2l-8 4.6-8-4.6V7.4l8-4.6Z"/>
      <path d="m4.4 7.6 7.6 4.5 7.6-4.5M12 12.1v8.7M8 5.1l8 4.7"/>
    </symbol>

    <symbol id="inventory" viewBox="0 0 24 24">
      <rect x="5" y="4" width="14" height="17" rx="2"/>
      <path d="M9 4V2.8h6V4M9 9h.1M12 9h4M9 13h.1M12 13h4M9 17h.1M12 17h4"/>
    </symbol>

    <symbol id="customers" viewBox="0 0 24 24">
      <circle cx="10" cy="8" r="3"/>
      <path d="M3.8 20v-1.2a5.7 5.7 0 0 1 5.7-5.7h1a5.7 5.7 0 0 1 5.7 5.7V20M16.3 4.7a3 3 0 0 1 0 5.8M18.2 13.4a5.4 5.4 0 0 1 2 4.2V20"/>
    </symbol>

    <symbol id="craftsman" viewBox="0 0 24 24">
      <path d="M3 17h18M5 17v-1a7 7 0 0 1 14 0v1M9 9V6.8a3 3 0 0 1 6 0V9M12 5v6M4 20h16"/>
    </symbol>

    <symbol id="truck" viewBox="0 0 24 24">
      <path d="M3 5h11v12H3V5ZM14 9h4l3 3v5h-7V9Z"/>
      <path d="M17 9v4h4"/>
      <circle cx="7" cy="18" r="2"/>
      <circle cx="18" cy="18" r="2"/>
    </symbol>

    <symbol id="debts" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <path d="M3 9h18M7 15h4"/>
    </symbol>

    <symbol id="reports" viewBox="0 0 24 24">
      <path d="M4 20V10M10 20V4M16 20v-7M22 20V7M2 20h22"/>
    </symbol>

    <symbol id="settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>
    </symbol>

    <!-- Extra shop-category icons -->
    <symbol id="faucet" viewBox="0 0 24 24">
      <path d="M4 12h12a4 4 0 0 1 4 4v2h-4v-2H9v3H5v-7Z"/>
      <path d="M8 12V8h6a3 3 0 0 0 3-3V4M13 4h8M17 2v4"/>
    </symbol>

    <symbol id="paint-roller" viewBox="0 0 24 24">
      <rect x="3" y="4" width="13" height="6" rx="1.5"/>
      <path d="M16 7h3v5h-7v3M12 15v6M9.5 21h5"/>
    </symbol>

    <symbol id="wrench" viewBox="0 0 24 24">
      <path d="M14.3 6.1a5 5 0 0 0-6.5 6.5L3 17.4A2.1 2.1 0 0 0 6 20.3l4.8-4.8a5 5 0 0 0 6.5-6.5l-3 3-2.4-.9-.9-2.4 3.3-2.6Z"/>
    </symbol>

    <symbol id="barcode" viewBox="0 0 24 24">
      <path d="M4 5v14M7 5v14M11 5v14M14 5v14M16.5 5v14M20 5v14"/>
    </symbol>

    <symbol id="calculator" viewBox="0 0 24 24">
      <rect x="4" y="2.8" width="16" height="18.4" rx="2"/>
      <rect x="7" y="6" width="10" height="4" rx="1"/>
      <path d="M8 14h.1M12 14h.1M16 14h.1M8 18h.1M12 18h.1M16 18h.1"/>
    </symbol>

    <symbol id="pipe" viewBox="0 0 24 24">
      <path d="M4 3v7a4 4 0 0 0 4 4h7v7"/>
      <path d="M2 3h4M13 21h4M3 7h3M15 18h3"/>
    </symbol>
  </defs>

  <!--
    All artwork is transparent. Change the stroke value or this opacity to tune
    contrast. The varied scale and rotation create an intentionally irregular,
    calm texture while the 960 × 560 tile remains seamless.
  -->
  <g stroke="#A7ADB5"
     stroke-width="1.65"
     stroke-linecap="round"
     stroke-linejoin="round"
     opacity="0.19">
    <use xlink:href="#dashboard" x="32" y="34" width="25" height="25" transform="rotate(-7 44.5 46.5)"/>
    <use xlink:href="#cart" x="170" y="78" width="28" height="28" transform="rotate(5 184 92)" opacity="0.82"/>
    <use xlink:href="#quotation" x="320" y="25" width="24" height="24" transform="rotate(-4 332 37)" opacity="0.9"/>
    <use xlink:href="#invoice" x="520" y="100" width="27" height="27" transform="rotate(6 533.5 113.5)"/>
    <use xlink:href="#return" x="695" y="40" width="30" height="30" transform="rotate(-9 710 55)" opacity="0.78"/>
    <use xlink:href="#purchases" x="875" y="78" width="25" height="25" transform="rotate(4 887.5 90.5)" opacity="0.92"/>

    <use xlink:href="#product" x="80" y="185" width="29" height="29" transform="rotate(7 94.5 199.5)"/>
    <use xlink:href="#inventory" x="250" y="152" width="24" height="24" transform="rotate(-5 262 164)" opacity="0.84"/>
    <use xlink:href="#customers" x="410" y="225" width="29" height="29" transform="rotate(4 424.5 239.5)"/>
    <use xlink:href="#craftsman" x="610" y="175" width="27" height="27" transform="rotate(-6 623.5 188.5)" opacity="0.87"/>
    <use xlink:href="#truck" x="790" y="250" width="30" height="30" transform="rotate(5 805 265)"/>
    <use xlink:href="#debts" x="920" y="160" width="24" height="24" transform="rotate(-3 932 172)" opacity="0.8"/>

    <use xlink:href="#reports" x="25" y="335" width="27" height="27" transform="rotate(4 38.5 348.5)" opacity="0.9"/>
    <use xlink:href="#settings" x="190" y="310" width="30" height="30" transform="rotate(-8 205 325)" opacity="0.78"/>
    <use xlink:href="#faucet" x="350" y="370" width="31" height="31" transform="rotate(5 365.5 385.5)"/>
    <use xlink:href="#paint-roller" x="560" y="300" width="28" height="28" transform="rotate(-5 574 314)" opacity="0.86"/>
    <use xlink:href="#wrench" x="720" y="405" width="30" height="30" transform="rotate(10 735 420)"/>
    <use xlink:href="#barcode" x="880" y="350" width="27" height="27" transform="rotate(-3 893.5 363.5)" opacity="0.76"/>

    <use xlink:href="#calculator" x="100" y="485" width="26" height="26" transform="rotate(-5 113 498)"/>
    <use xlink:href="#pipe" x="280" y="470" width="31" height="31" transform="rotate(7 295.5 485.5)" opacity="0.82"/>
    <use xlink:href="#cart" x="470" y="505" width="25" height="25" transform="rotate(-6 482.5 517.5)" opacity="0.86"/>
    <use xlink:href="#product" x="650" y="460" width="29" height="29" transform="rotate(9 664.5 474.5)"/>
    <use xlink:href="#quotation" x="820" y="510" width="24" height="24" transform="rotate(-4 832 522)" opacity="0.8"/>

    <!-- tiny neutral marks keep larger empty areas from feeling mechanically tiled -->
    <circle cx="145" cy="278" r="1.4" fill="#A7ADB5" stroke="none" opacity="0.7"/>
    <circle cx="475" cy="165" r="1.2" fill="#A7ADB5" stroke="none" opacity="0.55"/>
    <circle cx="850" cy="445" r="1.4" fill="#A7ADB5" stroke="none" opacity="0.62"/>
    <path d="M315 285h6M318 282v6" opacity="0.55"/>
    <path d="M670 335h5M672.5 332.5v5" opacity="0.48"/>
  </g>
</svg>
