        invoiceDate: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        createdBy: { type: ["string", "null"] }
        updatedBy: { type: ["string", "null"] }
    PurchaseItem:
      type: object
      required: [id, productId, quantity, listPrice, netPrice, total]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        productSku: { type: ["string", "null"] }
        unitName: { type: ["string", "null"] }
        quantity: { type: number }
        listPrice: { type: number }
        supplierDiscount: { type: number }
        netPrice: { type: number }
        extraCost: { type: number }
        trueCost: { type: number }
        total: { type: number }
    PurchaseItemInput:
      type: object
      required: [productId, quantity, netPrice]
      properties:
        productId: { type: integer }
        quantity: { type: number }
        listPrice: { type: number }
        supplierDiscount: { type: number }
        netPrice: { type: number }
        extraCost: { type: number }
        trueCost: { type: number }
    PurchaseInvoiceInput:
      type: object
      properties:
        supplierId: { type: integer }
        paymentType: { type: string, enum: [cash, credit, partial] }
        status: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItemInput"
        paidAmount: { type: number }
        notes: { type: string }
        invoiceDate: { type: string }
    PurchaseInvoiceUpdate:
      type: object
      properties:
        supplierId: { type: integer }
        paymentType: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItemInput"
        paidAmount: { type: number }
        notes: { type: string }
        invoiceDate: { type: string }
    FinalizePurchaseInput:
      type: object
      required: [paymentType]
      properties:
        paymentType: { type: string, enum: [cash, credit, partial] }
        paidAmount: { type: number }
        notes: { type: string }
    PurchasesPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseInvoice"
        total: { type: integer }

    # Stock Count
    StockCount:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        status: { type: string }
        notes: { type: ["string", "null"] }
        itemCount: { type: integer }
        createdAt: { type: string }
        finalizedAt: { type: ["string", "null"] }
    StockCountDetail:
      type: object
      required: [id, status, items, createdAt]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        status: { type: string }
        notes: { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockCountItem"
        createdAt: { type: string }
        finalizedAt: { type: ["string", "null"] }
    StockCountItem:
      type: object
      required: [id, productId, systemQty, countedQty, difference]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        productSku: { type: ["string", "null"] }
        unitName: { type: ["string", "null"] }
        systemQty: { type: number }
        countedQty: { type: number }
        difference: { type: number }
        notes: { type: ["string", "null"] }
    StockCountInput:
      type: object
      properties:
        name: { type: string }
        notes: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockCountItemInput"
    StockCountItemInput:
      type: object
      required: [productId, countedQty]
      properties:
        productId: { type: integer }
        countedQty: { type: number }
        notes: { type: string }
    StockCountUpdate:
      type: object
      properties:
        name: { type: string }
        notes: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockCountItemInput"

    # Debts
    DebtSummary:
      type: object
      required: [id, name, totalDebt, lastActivity]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: ["string", "null"] }
        totalDebt: { type: number }
        lastActivity: { type: ["string", "null"] }
        overdueCount: { type: integer }

    # Draft
    Draft:
      type: object
      required: [id, type, entityId, data, savedAt]
      properties:
        id: { type: integer }
        type: { type: string }
        entityId: { type: string }
        data: { type: string }
        savedAt: { type: string }
        savedBy: { type: ["string", "null"] }
    DraftInput:
      type: object
      required: [type, entityId, data]
      properties:
        type: { type: string }
        entityId: { type: string }
        data: { type: string }
        savedBy: { type: string }

    # Reports
    SalesReport:
      type: object
      required: [from, to, totalSales, totalCash, totalCredit, invoiceCount, totalDiscount, estimatedProfit]
      properties:
        from: { type: string }
        to: { type: string }
        totalSales: { type: number }
        totalCash: { type: number }
        totalCredit: { type: number }
        invoiceCount: { type: integer }
        totalDiscount: { type: number }
        estimatedProfit: { type: number }
        dailyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/DailySalesItem"
    DailySalesItem:
      type: object
      required: [date, sales, invoiceCount]
      properties:
        date: { type: string }
        sales: { type: number }
