        cash: { type: number }
        credit: { type: number }
    InventoryReport:
      type: object
      required: [totalProducts, totalValue, lowStockCount]
      properties:
        totalProducts: { type: integer }
        totalValue: { type: number }
        lowStockCount: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
    InventoryItem:
      type: object
      required: [productId, productName, currentStock, sellingPrice, stockValue]
      properties:
        productId: { type: integer }
        productName: { type: string }
        sku: { type: ["string", "null"] }
        unitName: { type: ["string", "null"] }
        currentStock: { type: number }
        sellingPrice: { type: number }
        trueCost: { type: number }
        stockValue: { type: number }
        isLowStock: { type: boolean }
    BestSellerItem:
      type: object
      required: [productId, productName, totalQty, totalRevenue]
      properties:
        productId: { type: integer }
        productName: { type: string }
        totalQty: { type: number }
        totalRevenue: { type: number }
        orderCount: { type: integer }
    PurchasesReport:
      type: object
      required: [from, to, totalPurchases, invoiceCount]
      properties:
        from: { type: string }
        to: { type: string }
        totalPurchases: { type: number }
        invoiceCount: { type: integer }
        totalPaid: { type: number }
        totalUnpaid: { type: number }
    CraftsmanCommissionItem:
      type: object
      required: [craftsmanId, craftsmanName, totalSales, totalCommission]
      properties:
        craftsmanId: { type: integer }
        craftsmanName: { type: string }
        totalSales: { type: number }
        invoiceCount: { type: integer }
        totalCommission: { type: number }

    # Settings
    Settings:
      type: object
      required: [shopName, currency]
      properties:
        shopName: { type: string }
        shopPhone: { type: ["string", "null"] }
        shopAddress: { type: ["string", "null"] }
        currency: { type: string }
        defaultPrintTemplate: { type: string }
        lowStockThreshold: { type: integer }
        enableCraftsmanCommission: { type: boolean }
        enableDarkMode: { type: boolean }
        language: { type: string }
        invoicePrefix: { type: string }
        quotationPrefix: { type: string }
        purchasePrefix: { type: string }
        invoiceTerms: { type: ["string", "null"] }
        lastBackupAt: { type: ["string", "null"] }
    SettingsUpdate:
      type: object
      properties:
        shopName: { type: string }
        shopPhone: { type: string }
        shopAddress: { type: string }
        currency: { type: string }
        defaultPrintTemplate: { type: string }
        lowStockThreshold: { type: integer }
        enableCraftsmanCommission: { type: boolean }
        enableDarkMode: { type: boolean }
        language: { type: string }
        invoicePrefix: { type: string }
        quotationPrefix: { type: string }
        purchasePrefix: { type: string }
        invoiceTerms: { type: string }

    # Backup
    BackupInfo:
      type: object
      required: [filename, createdAt, size]
      properties:
        filename: { type: string }
        createdAt: { type: string }
        size: { type: integer }
        path: { type: ["string", "null"] }
