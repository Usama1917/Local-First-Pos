components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    DeletePreview:
      type: object
      required: [canDelete, mode, effects, warnings, blockers]
      properties:
        canDelete: { type: boolean }
        mode:
          type: string
          enum: [hard, archive]
          description: hard = row removed; archive = kept but deactivated
        effects:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        blockers:
          type: array
          items: { type: string }

    # Auth
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AuthUser:
      type: object
      required: [id, username, role, name]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
    User:
      type: object
      required: [id, username, name, role]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        password: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string }
    UserInput:
      type: object
      required: [username, password, name]
      properties:
        username: { type: string }
        password: { type: string }
        name: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        isActive: { type: boolean }
    UserUpdate:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
        name: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        isActive: { type: boolean }
    UsersPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total: { type: integer }

    # Dashboard
    DashboardSummary:
      type: object
      required: [todaySales, todayCash, todayCredit, totalReceivables, totalPayables, lowStockCount, pendingQuotations, todayInvoicesCount]
      properties:
        todaySales: { type: number }
        todayCash: { type: number }
        todayCredit: { type: number }
        todayInvoicesCount: { type: integer }
        totalReceivables: { type: number }
        totalPayables: { type: number }
        lowStockCount: { type: integer }
        pendingQuotations: { type: integer }
        stockValue: { type: number }

    # Category
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: ["string", "null"] }
        productCount: { type: integer }
        createdAt: { type: string }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        nameEn: { type: string }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string }
        nameEn: { type: string }

    # Brand
    Brand:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: ["string", "null"] }
        createdAt: { type: string }
    BrandInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        nameEn: { type: string }
    BrandUpdate:
      type: object
      properties:
        name: { type: string }
        nameEn: { type: string }

    # Unit
    Unit:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: ["string", "null"] }
    UnitInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        nameEn: { type: string }
    UnitUpdate:
      type: object
      properties:
        name: { type: string }
        nameEn: { type: string }

    # Product
    Product:
      type: object
      required: [id, nameAr, sku, currentStock, sellingPrice]
      properties:
        id: { type: integer }
        nameAr: { type: string }
        nameEn: { type: ["string", "null"] }
        sku: { type: string }
        barcode: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        brandId: { type: ["integer", "null"] }
        brandName: { type: ["string", "null"] }
        supplierId: { type: ["integer", "null"] }
        supplierName: { type: ["string", "null"] }
        unitId: { type: ["integer", "null"] }
        unitName: { type: ["string", "null"] }
        listPrice: { type: number }
        supplierDiscount: { type: number }
        netPurchasePrice: { type: number }
        extraCost: { type: number }
        trueCost: { type: number }
        sellingPrice: { type: number }
        minSellingPrice: { type: ["number", "null"] }
        currentStock: { type: number }
        minStock: { type: number }
        location: { type: ["string", "null"] }
